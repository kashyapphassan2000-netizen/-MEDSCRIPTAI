<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email OTP Verification</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --text:#111827; --muted:#6b7280; --accent:#2563eb; --err:#dc2626; --ok:#16a34a; --border:#e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --card:#181b22; --text:#f3f4f6; --muted:#9ca3af; --accent:#3b82f6; --border:#2a2f3a; }
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
    .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; }
    h1 { font-size:22px; margin:0 0 6px; }
    p.sub { color:var(--muted); margin:0 0 22px; font-size:14px; }
    label { font-size:13px; font-weight:600; display:block; margin-bottom:6px; }
    input { width:100%; padding:12px; font-size:16px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--text); }
    input:focus { outline:2px solid var(--accent); border-color:transparent; }
    #otp { letter-spacing:10px; text-align:center; font-size:24px; font-weight:700; }
    button { width:100%; margin-top:14px; padding:12px; font-size:15px; font-weight:600; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .link { background:none; color:var(--accent); padding:6px; margin-top:8px; font-weight:500; }
    .msg { margin-top:14px; font-size:14px; min-height:20px; word-break:break-word; }
    .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
    .hidden { display:none; }
    .row { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:10px; }
    .done { text-align:center; font-size:48px; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <section id="step-email">
      <h1>Verify your email</h1>
      <p class="sub">Enter any email address and we'll send a 6-digit OTP to it.</p>
      <form id="email-form">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        <button id="send-btn" type="submit">Send OTP</button>
      </form>
    </section>

    <section id="step-otp" class="hidden">
      <h1>Enter OTP</h1>
      <p class="sub">Code sent to <strong id="sent-to"></strong></p>
      <form id="otp-form">
        <label for="otp">6-digit code</label>
        <input id="otp" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required />
        <button id="verify-btn" type="submit">Verify</button>
      </form>
      <div class="row"><span id="expiry"></span><span id="cooldown"></span></div>
      <button id="resend-btn" class="link" type="button" disabled>Resend OTP</button>
      <button id="change-btn" class="link" type="button">Use a different email</button>
    </section>

    <section id="step-done" class="hidden">
      <div class="done">✅</div>
      <h1 style="text-align:center">Verified</h1>
      <p class="sub" style="text-align:center" id="done-text"></p>
      <button id="restart-btn" type="button">Verify another email</button>
    </section>

    <div id="msg" class="msg"></div>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  let email = "", expiryTimer, cooldownTimer;

  function show(step) {
    ["step-email", "step-otp", "step-done"].forEach((s) => $(s).classList.toggle("hidden", s !== step));
  }
  function msg(text, type = "") { const m = $("msg"); m.className = "msg " + type; m.innerHTML = text; }

  async function post(url, data) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
    const body = await r.json().catch(() => ({}));
    return { ok: r.ok, body };
  }

  function countdown(el, seconds, label, onEnd) {
    let s = seconds;
    const tick = () => {
      if (s <= 0) { el.textContent = ""; clearInterval(t); onEnd && onEnd(); return; }
      el.textContent = `${label} ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; s--;
    };
    const t = setInterval(tick, 1000); tick(); return t;
  }

  function startTimers(expiresIn, resendIn) {
    clearInterval(expiryTimer); clearInterval(cooldownTimer);
    expiryTimer = countdown($("expiry"), expiresIn, "Expires in", () => msg("OTP expired. Resend a new one.", "err"));
    $("resend-btn").disabled = true;
    cooldownTimer = countdown($("cooldown"), resendIn, "Resend in", () => ($("resend-btn").disabled = false));
  }

  async function sendOtp(btn) {
    btn.disabled = true; msg("Sending…");
    const { ok, body } = await post("/api/send-otp", { email });
    btn.disabled = false;
    if (!ok) { msg(body.error || "Failed to send OTP.", "err"); if (body.retryAfter) startTimers(0, body.retryAfter); return false; }
    let text = body.message;
    if (body.previewUrl) text += ` <br><small>Test mode (no SMTP set): <a href="${body.previewUrl}" target="_blank" rel="noopener">open the email</a></small>`;
    msg(text, "ok");
    startTimers(body.expiresInSeconds, body.resendInSeconds);
    return true;
  }

  $("email-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    email = $("email").value.trim();
    if (await sendOtp($("send-btn"))) { $("sent-to").textContent = email; show("step-otp"); $("otp").value = ""; $("otp").focus(); }
  });

  $("otp-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("verify-btn"); btn.disabled = true; msg("Verifying…");
    const { ok, body } = await post("/api/verify-otp", { email, otp: $("otp").value.trim() });
    btn.disabled = false;
    if (!ok) return msg(body.error || "Verification failed.", "err");
    clearInterval(expiryTimer); clearInterval(cooldownTimer);
    $("done-text").textContent = body.message; msg(""); show("step-done");
  });

  $("otp").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); });
  $("resend-btn").addEventListener("click", () => sendOtp($("resend-btn")));
  $("change-btn").addEventListener("click", () => { clearInterval(expiryTimer); clearInterval(cooldownTimer); msg(""); show("step-email"); });
  $("restart-btn").addEventListener("click", () => { $("email").value = ""; msg(""); show("step-email"); });
</script>
</body>
</html>
