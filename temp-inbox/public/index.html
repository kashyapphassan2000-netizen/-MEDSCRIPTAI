<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Temp Inbox</title>
<style>
  :root {
    --bg:#f3f4f8; --panel:#ffffff; --text:#14161c; --muted:#666c7a; --line:#e2e4ea;
    --accent:#4f46e5; --accent-ink:#fff; --ok:#15803d; --warn:#b45309; --err:#b91c1c; --otp-bg:#eef2ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1015; --panel:#171a21; --text:#eceef3; --muted:#9aa0ad; --line:#2a2e38;
            --accent:#818cf8; --accent-ink:#0e1015; --otp-bg:#22264a; --ok:#4ade80; --warn:#fbbf24; --err:#f87171; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { font-size:22px; margin:0; }
  .muted { color:var(--muted); font-size:13px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; }

  form#create { display:flex; gap:8px; flex-wrap:wrap; align-items:stretch; padding:14px; }
  .addr { display:flex; flex:1 1 420px; min-width:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .addr input, .addr select { border:0; background:transparent; color:var(--text); font-size:16px; padding:11px 12px; min-width:0; }
  .addr input { flex:1 1 50%; font-family:var(--mono); }
  .addr span { align-self:center; color:var(--muted); font-family:var(--mono); }
  .addr select { flex:1 1 50%; font-family:var(--mono); cursor:pointer; }
  .addr:focus-within { outline:2px solid var(--accent); outline-offset:-1px; }
  button { font:inherit; cursor:pointer; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:8px 12px; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600; }
  button.plus { width:52px; font-size:26px; line-height:1; padding:0; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #random { font-size:13px; }
  #note { padding:0 14px 12px; font-size:13px; min-height:18px; }
  #note.err { color:var(--err); } #note.ok { color:var(--ok); }

  .grid { display:grid; grid-template-columns: 320px 1fr; gap:16px; margin-top:16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  #inboxes { display:flex; flex-direction:column; gap:8px; }
  .inbox { padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
  .inbox.active { border-color:var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .inbox .a { font-family:var(--mono); font-size:14px; word-break:break-all; }
  .inbox .row { display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; }
  .timer { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px; }
  .timer.low { color:var(--warn); }
  .badge { font-size:11px; padding:2px 7px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .badge.public { color:var(--warn); border-color:currentColor; }
  .count { font-size:12px; background:var(--accent); color:var(--accent-ink); border-radius:99px; padding:1px 8px; }
  .mini { font-size:12px; padding:4px 8px; }
  .empty { padding:28px 16px; text-align:center; color:var(--muted); }

  #mail { min-height:380px; display:flex; flex-direction:column; min-width:0; }
  #mail .top { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:center; }
  #mail .top .a { font-family:var(--mono); word-break:break-all; }
  .msg { padding:12px 14px; border-bottom:1px solid var(--line); display:grid; grid-template-columns: 1fr auto; gap:4px 12px; cursor:pointer; }
  .msg:hover { background:var(--otp-bg); }
  .msg .s { font-weight:600; min-width:0; overflow-wrap:anywhere; }
  .msg .f, .msg .p { color:var(--muted); font-size:13px; min-width:0; overflow-wrap:anywhere; }
  .msg .t { color:var(--muted); font-size:12px; white-space:nowrap; }
  .otp { display:inline-flex; align-items:center; gap:8px; background:var(--otp-bg); border-radius:8px; padding:4px 6px 4px 10px; font-family:var(--mono); font-weight:700; font-size:18px; letter-spacing:2px; }
  .otp button { font-size:12px; letter-spacing:0; font-family:system-ui; padding:3px 8px; }
  #reader { padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  #reader iframe { width:100%; min-height:420px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .waiting { display:flex; align-items:center; gap:8px; justify-content:center; padding:40px 16px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Temp Inbox</h1>
    <span class="muted">Pick a name, press +, get a working inbox for <b id="mins">10</b> minutes.</span>
  </header>

  <section class="panel">
    <form id="create" autocomplete="off">
      <div class="addr">
        <input id="username" placeholder="raman" aria-label="Name before @" maxlength="30" required />
        <span>@</span>
        <select id="domain" aria-label="Domain"><option>Loading domains…</option></select>
      </div>
      <button id="random" type="button" title="Random name">Random</button>
      <button id="add" class="primary plus" type="submit" title="Create inbox" aria-label="Create inbox">+</button>
    </form>
    <div id="note" class="muted"></div>
  </section>

  <div class="grid">
    <aside id="inboxes"><div class="panel empty">No inboxes yet. Type a name and press <b>+</b>.</div></aside>
    <section id="mail" class="panel"><div class="empty">Select an inbox to see its mail.</div></section>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const state = { inboxes: [], active: null, messages: {}, domains: [] };
let pollTimer;

const api = async (url, opts = {}) => {
  const r = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
  if (r.status === 204) return {};
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(body.error || "Request failed"), { status: r.status });
  return body;
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const note = (t, cls = "muted") => { const n = $("#note"); n.className = cls; n.textContent = t; };
const fmt = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const ago = (iso) => { const s = (Date.now() - new Date(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : new Date(iso).toLocaleTimeString(); };

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = o), 1200); }
}

async function loadDomains() {
  try {
    const { domains, lifetimeSeconds } = await api("/api/domains");
    state.domains = domains;
    $("#mins").textContent = Math.round(lifetimeSeconds / 60);
    const groups = {};
    domains.forEach((d, i) => (groups[d.label] ||= []).push(`<option value="${i}">${esc(d.domain)}</option>`));
    $("#domain").innerHTML = Object.entries(groups).map(([l, o]) => `<optgroup label="${esc(l)}">${o.join("")}</optgroup>`).join("");
  } catch (e) {
    $("#domain").innerHTML = "<option>Unavailable</option>";
    note(e.message, "err");
  }
}

$("#random").onclick = () => {
  const a = ["blue","quick","silent","lucky","red","cool","sharp","bright"], b = ["fox","tiger","river","comet","pixel","wolf","otter","maple"];
  $("#username").value = `${a[Math.random()*a.length|0]}${b[Math.random()*b.length|0]}${Math.random()*900+100|0}`;
};

$("#create").onsubmit = async (e) => {
  e.preventDefault();
  const d = state.domains[$("#domain").value];
  const username = $("#username").value.trim().toLowerCase();
  if (!d) return note("Domains not loaded yet.", "err");
  $("#add").disabled = true; note("Creating inbox…");
  try {
    const inbox = await api("/api/inboxes", { method: "POST", body: JSON.stringify({ username, domain: d.domain, provider: d.provider }) });
    state.inboxes.unshift(inbox);
    state.active = inbox.id;
    note(`${inbox.address} is live. Use it anywhere for ${$("#mins").textContent} minutes.`, "ok");
    $("#username").value = "";
    render(); poll();
  } catch (e) {
    note(e.message, "err");
  } finally {
    $("#add").disabled = false;
  }
};

async function removeInbox(id) {
  await api(`/api/inboxes/${id}`, { method: "DELETE" }).catch(() => {});
  state.inboxes = state.inboxes.filter((i) => i.id !== id);
  delete state.messages[id];
  if (state.active === id) state.active = state.inboxes[0]?.id || null;
  render();
}

async function extend(id) {
  try {
    const u = await api(`/api/inboxes/${id}/extend`, { method: "POST" });
    Object.assign(state.inboxes.find((i) => i.id === id), u);
    render();
  } catch (e) { note(e.message, "err"); }
}

function renderInboxes() {
  const box = $("#inboxes");
  if (!state.inboxes.length) { box.innerHTML = `<div class="panel empty">No inboxes yet. Type a name and press <b>+</b>.</div>`; return; }
  box.innerHTML = state.inboxes.map((i) => {
    const left = i.expiresAt - Date.now(), n = (state.messages[i.id] || []).length;
    return `<div class="panel inbox ${i.id === state.active ? "active" : ""}" data-id="${i.id}">
      <div class="a">${esc(i.address)}</div>
      <div class="row">
        <span class="timer ${left < 120000 ? "low" : ""}" data-exp="${i.expiresAt}">⏱ ${fmt(left)}</span>
        <span>${n ? `<span class="count">${n}</span>` : ""} <span class="badge ${i.provider === "guerrilla" ? "public" : ""}">${{ guerrilla: "public", mailtm: "private", custom: "your domain" }[i.provider]}</span></span>
      </div>
      <div class="row">
        <button class="mini" data-act="copy">Copy address</button>
        <span><button class="mini" data-act="extend">+10 min</button> <button class="mini" data-act="del">Delete</button></span>
      </div>
    </div>`;
  }).join("");
}

function renderMail() {
  const el = $("#mail"), inbox = state.inboxes.find((i) => i.id === state.active);
  if (!inbox) { el.innerHTML = `<div class="empty">Select an inbox to see its mail.</div>`; return; }
  const msgs = state.messages[inbox.id] || [];
  el.innerHTML = `<div class="top"><span class="a">${esc(inbox.address)}</span><button class="mini" data-copy="${esc(inbox.address)}">Copy</button></div>` +
    (msgs.length ? msgs.map((m) => `
      <div class="msg" data-mid="${esc(m.id)}">
        <div class="s">${esc(m.subject)}</div><div class="t">${ago(m.receivedAt)}</div>
        <div class="f">${esc(m.fromName ? `${m.fromName} <${m.from}>` : m.from)}</div><div></div>
        ${m.otp ? `<div><span class="otp">${esc(m.otp)} <button data-copy="${esc(m.otp)}">Copy OTP</button></span></div><div></div>` : `<div class="p">${esc(m.preview)}</div><div></div>`}
      </div>`).join("")
    : `<div class="waiting"><span class="dot"></span> Waiting for email… checks every 5 seconds</div>`) + `<div id="reader" hidden></div>`;
}

function render() { renderInboxes(); renderMail(); }

$("#inboxes").onclick = (e) => {
  const card = e.target.closest(".inbox"); if (!card) return;
  const id = card.dataset.id, act = e.target.dataset.act;
  if (act === "copy") return copy(state.inboxes.find((i) => i.id === id).address, e.target);
  if (act === "del") return removeInbox(id);
  if (act === "extend") return extend(id);
  state.active = id; render();
};

$("#mail").onclick = async (e) => {
  if (e.target.dataset.copy) { e.stopPropagation(); return copy(e.target.dataset.copy, e.target); }
  const row = e.target.closest(".msg"); if (!row) return;
  const reader = $("#reader");
  reader.hidden = false; reader.textContent = "Opening…";
  reader.scrollIntoView({ behavior: "smooth", block: "nearest" });
  try {
    const m = await api(`/api/inboxes/${state.active}/messages/${encodeURIComponent(row.dataset.mid)}`);
    reader.innerHTML = `<div><b>${esc(m.subject)}</b><div class="muted">${esc(m.from)} · ${new Date(m.receivedAt).toLocaleString()}</div></div>
      ${m.otp ? `<div><span class="otp">${esc(m.otp)} <button data-copy="${esc(m.otp)}">Copy OTP</button></span></div>` : ""}
      <iframe sandbox="" referrerpolicy="no-referrer" title="Email body"></iframe>`;
    reader.querySelector("iframe").srcdoc = m.html || `<pre style="white-space:pre-wrap;font:14px system-ui">${esc(m.text)}</pre>`;
  } catch (err) { reader.textContent = err.message; }
};

async function poll() {
  clearTimeout(pollTimer);
  await Promise.all(state.inboxes.map(async (i) => {
    try {
      const { messages } = await api(`/api/inboxes/${i.id}/messages`);
      const before = (state.messages[i.id] || []).length;
      state.messages[i.id] = messages;
      if (messages.length > before && before > 0 || (before === 0 && messages.length)) document.title = `(${messages.length}) Temp Inbox`;
    } catch (e) {
      if (e.status === 404 || e.status === 410) { state.inboxes = state.inboxes.filter((x) => x.id !== i.id); if (state.active === i.id) state.active = state.inboxes[0]?.id || null; note(`${i.address} expired.`); }
    }
  }));
  const reading = !$("#reader")?.hidden;
  renderInboxes(); if (!reading) renderMail();
  if (state.inboxes.length) pollTimer = setTimeout(poll, 5000);
}

setInterval(() => document.querySelectorAll(".timer").forEach((t) => {
  const left = t.dataset.exp - Date.now(); t.textContent = `⏱ ${fmt(left)}`; t.classList.toggle("low", left < 120000);
}), 1000);

(async () => {
  await loadDomains();
  try { state.inboxes = (await api("/api/inboxes")).inboxes; state.active = state.inboxes[0]?.id || null; } catch {}
  render(); if (state.inboxes.length) poll();
})();
</script>
</body>
</html>
